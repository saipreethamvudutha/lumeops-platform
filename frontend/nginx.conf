server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers (HIPAA / OWASP) ─────────────────────────────────
    # Prevent clickjacking
    add_header X-Frame-Options "DENY" always;
    # Prevent MIME-type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    # XSS protection (legacy browsers)
    add_header X-XSS-Protection "1; mode=block" always;
    # Referrer policy — don't leak paths to external sites
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions policy — restrict browser features
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    # Content Security Policy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;
    # Strict Transport Security (effective once behind TLS terminator)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── Cache control for static assets ──────────────────────────────────
    # Vite adds content hashes to filenames, so aggressive caching is safe
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── SPA fallback — all routes resolve to index.html ──────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy — forward /api requests to backend ─────────────────────
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    location /health {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    location /ready {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # ── Block sensitive paths ────────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    location ~ \.(env|git|gitignore|dockerignore)$ {
        deny all;
        return 404;
    }
}
