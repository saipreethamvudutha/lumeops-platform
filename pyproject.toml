[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "lumeops"
version = "0.1.0"
description = "HIPAA-compliant healthcare AI observability platform"
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.11"
authors = [
    {name = "LumeOps Team"},
]

dependencies = [
    # Web framework
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.27.0,<1.0.0",
    "gunicorn>=21.2.0,<23.0.0",

    # Data validation
    "pydantic>=2.6.0,<3.0.0",
    "pydantic-settings>=2.1.0,<3.0.0",

    # Database
    "sqlalchemy[asyncio]>=2.0.25,<3.0.0",
    "asyncpg>=0.29.0,<1.0.0",
    "alembic>=1.13.0,<2.0.0",

    # Redis
    "redis[hiredis]>=5.0.0,<6.0.0",

    # Elasticsearch
    "elasticsearch[async]>=8.12.0,<9.0.0",

    # Security & Encryption
    "cryptography>=42.0.0,<44.0.0",
    "pyjwt>=2.8.0,<3.0.0",
    "passlib[bcrypt]>=1.7.4,<2.0.0",
    "argon2-cffi>=23.1.0,<24.0.0",

    # AWS
    "boto3>=1.34.0,<2.0.0",

    # PDF generation
    "reportlab>=4.1.0,<5.0.0",

    # Scheduling
    "apscheduler>=3.10.0,<4.0.0",

    # HTTP client
    "httpx>=0.27.0,<1.0.0",

    # Monitoring
    "structlog>=24.1.0,<25.0.0",
    "prometheus-client>=0.20.0,<1.0.0",

    # Utilities
    "python-multipart>=0.0.7,<1.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "orjson>=3.9.0,<4.0.0",
    "numpy>=1.26.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=4.1.0,<6.0.0",
    "pytest-xdist>=3.5.0,<4.0.0",
    "httpx>=0.27.0,<1.0.0",
    "factory-boy>=3.3.0,<4.0.0",
    "faker>=23.0.0,<25.0.0",
    "bandit>=1.7.7,<2.0.0",
    "ruff>=0.3.0,<1.0.0",
    "mypy>=1.8.0,<2.0.0",
    "pre-commit>=3.6.0,<4.0.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "S", "B", "A", "C4", "UP", "RUF"]
ignore = ["S101"]  # Allow assert in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --strict-markers --tb=short"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]  # Allow assert in non-test code for validation
